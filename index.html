<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎰 JEPA SLOT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
  }
  
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a0845, #0a0015 70%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; user-select: none;
    padding: 10px;
    touch-action: manipulation;
  }
  
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: 
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent);
    animation: twinkle 4s infinite; opacity: 0.5; pointer-events: none;
  }
  @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  
  h1 {
    font-size: clamp(24px, 6vw, 36px);
    margin-bottom: 8px;
    background: linear-gradient(90deg, #4dd0e1, #FFD700, #4dd0e1);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; animation: shine 3s linear infinite;
    letter-spacing: 3px; z-index: 2; text-align: center;
  }
  @keyframes shine { to { background-position: 200% center; } }
  
  .balance {
    background: rgba(0,0,0,0.5); border: 2px solid #FFD700;
    border-radius: 12px; padding: 6px 18px; margin-bottom: 10px;
    font-size: clamp(12px, 3.5vw, 16px);
    box-shadow: 0 0 20px rgba(255,215,0,0.3); z-index: 2;
  }
  .balance b { color: #FFD700; font-size: clamp(16px, 5vw, 22px); margin-left: 6px; text-shadow: 0 0 10px #FFD700; }
  
  .machine {
    background: linear-gradient(180deg, #1a1a2e, #0f0f1e);
    border: 3px solid #4dd0e1; border-radius: 16px;
    padding: 10px;
    box-shadow: 0 0 40px rgba(77,208,225,0.4), inset 0 0 30px rgba(77,208,225,0.1);
    position: relative; z-index: 2;
    width: min(95vw, 380px);
  }
  
  .reels {
    display: flex; gap: 6px; background: #000; padding: 8px;
    border-radius: 10px; box-shadow: inset 0 0 20px #000;
    justify-content: center;
  }
  
  .reel-window {
    flex: 1; aspect-ratio: 1 / 1.1;
    max-width: 100px;
    background: linear-gradient(180deg, #f5f5f5, #ddd);
    border-radius: 8px; overflow: hidden; position: relative;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px rgba(77,208,225,0.3);
  }
  
  .reel-strip {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    transition: transform 0.1s linear;
  }
  
  .reel-item {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    aspect-ratio: 1 / 1.1;
  }
  
  .reel-item img {
    width: 70%; height: 70%; object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
  }
  
  .fallback-icon {
    width: 70%; aspect-ratio: 1;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 8px; font-weight: bold;
    text-align: center; padding: 2px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 3px 0 rgba(255,255,255,0.3);
    border: 2px solid rgba(0,0,0,0.5);
    text-shadow: 1px 1px 2px black;
  }
  
  .reel-window::before, .reel-window::after {
    content: ''; position: absolute; left: 0; right: 0; height: 20px;
    z-index: 3; pointer-events: none;
  }
  .reel-window::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); }
  .reel-window::after { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent); }
  
  .reel-window.win { animation: winPulse 0.5s infinite alternate; }
  @keyframes winPulse {
    from { box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px #FFD700; }
    to { box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 40px #FFD700, 0 0 70px #FFD700; }
  }
  
  .controls {
    margin-top: 10px; display: flex; gap: 6px;
    justify-content: center; align-items: center; flex-wrap: wrap;
  }
  
  button {
    font-family: inherit; font-size: clamp(12px, 3.5vw, 14px);
    font-weight: bold; padding: 8px 16px;
    border: none; border-radius: 8px;
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 1px;
  }
  
  .spin-btn {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #000; box-shadow: 0 4px 0 #8B6508, 0 0 20px rgba(255,215,0,0.6);
    font-size: clamp(14px, 4vw, 16px);
    padding: 10px 24px;
    flex-grow: 1; max-width: 200px;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #8B6508; }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }
  
  .bet-control {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.5); padding: 4px 8px;
    border-radius: 8px; border: 2px solid #4dd0e1;
  }
  .bet-control button {
    padding: 4px 10px; font-size: clamp(12px, 3.5vw, 14px);
    background: #4dd0e1; color: #000; border-radius: 6px;
    box-shadow: 0 2px 0 #1a7a9e;
  }
  .bet-control span {
    min-width: 45px; text-align: center;
    color: #4dd0e1; font-weight: bold;
    font-size: clamp(12px, 3.5vw, 15px);
  }
  
  .message {
    margin-top: 10px; font-size: clamp(13px, 3.8vw, 17px);
    font-weight: bold; min-height: 24px;
    text-align: center; text-shadow: 0 0 15px currentColor;
    transition: all 0.3s; z-index: 2; padding: 0 8px;
  }
  .message.win { color: #4ade80; animation: pop 0.5s; }
  .message.lose { color: #f87171; }
  .message.jackpot { 
    color: #FFD700; font-size: clamp(16px, 5vw, 22px);
    animation: jackpot 0.4s infinite alternate;
  }
  @keyframes pop { 0%{transform:scale(0.5)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  @keyframes jackpot {
    from { transform: scale(1); text-shadow: 0 0 20px #FFD700; }
    to { transform: scale(1.15); text-shadow: 0 0 40px #FFD700, 0 0 60px #4dd0e1; }
  }
  
  .stats {
    margin-top: 8px; display: flex; gap: 10px;
    font-size: clamp(10px, 3vw, 12px); opacity: 0.8; z-index: 2;
    flex-wrap: wrap; justify-content: center;
  }
  .stats span b { color: #FFD700; }
  
  .reset-btn {
    margin-top: 8px; background: #444; color: white;
    padding: 6px 12px; font-size: clamp(10px, 3vw, 12px);
    border-radius: 8px; z-index: 2;
  }
  
  .payouts {
    margin-top: 8px; font-size: clamp(9px, 2.6vw, 11px);
    opacity: 0.75; text-align: center; line-height: 1.6;
    z-index: 2; max-width: 95vw; padding: 0 10px;
  }
  .payouts b { color: #4dd0e1; }
  
  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .particle { position: absolute; font-size: 30px; animation: fall 3s linear forwards; }
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  
  .shake { animation: shake 0.5s; }
  @keyframes shake {
    0%, 100% { transform: translate(0,0); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-5px, -5px); }
    20%, 40%, 60%, 80% { transform: translate(5px, 5px); }
  }
  
  .jackpot-overlay {
    position: fixed; inset: 0;
    background: rgba(255, 215, 0, 0.15);
    pointer-events: none; z-index: 98;
    animation: flash 0.3s 4;
  }
  @keyframes flash { 0%,100%{opacity:0} 50%{opacity:1} }
  
  /* HP mode (layar kecil) */
  @media (max-width: 500px) {
    h1 { letter-spacing: 2px; }
    .machine { padding: 8px; }
    .reels { gap: 4px; padding: 6px; }
    .reel-window::before, .reel-window::after { height: 15px; }
  }
  
  /* HP landscape (layar lebar tapi pendek) */
  @media (max-height: 500px) {
    h1 { font-size: 20px; margin-bottom: 4px; }
    .balance { padding: 4px 14px; margin-bottom: 6px; }
    .machine { padding: 6px; width: min(70vw, 320px); }
    .controls { margin-top: 6px; }
    .message { margin-top: 6px; }
    .payouts, .stats { display: none; }
  }
</style>
</head>
<body>

<div id="particles"></div>

<h1>🎰 JEPA SLOT 🎰</h1>

<div class="balance">
  💰 <b id="balance">1000</b>
</div>

<div class="machine" id="machine">
  <div class="reels">
    <div class="reel-window" id="reel1"><div class="reel-strip" id="strip1"></div></div>
    <div class="reel-window" id="reel2"><div class="reel-strip" id="strip2"></div></div>
    <div class="reel-window" id="reel3"><div class="reel-strip" id="strip3"></div></div>
  </div>
  
  <div class="controls">
    <div class="bet-control">
      <button id="betDown">−</button>
      <span id="betAmount">10</span>
      <button id="betUp">+</button>
    </div>
    <button class="spin-btn" id="spinBtn">🎰 SPIN</button>
  </div>
  
  <div class="message" id="message">Tekan SPIN untuk mulai!</div>
</div>

<div class="payouts">
  <b>💎 Diamond Lock x500</b> | <b>🔐 World Lock x200</b> | <b>🔒 Small Lock x100</b><br>
  🪨 Rock x50 | 🪵 Wood x30 | 🌿 Grass x20 | 🟫 Dirt x10<br>
  Dua sama = x2 
</div>

<div class="stats">
  <span>Spin: <b id="totalSpin">0</b></span>
  <span>Menang: <b id="totalWin">0</b></span>
  <span>Jackpot: <b id="totalJackpot">0</b></span>
</div>

<button class="reset-btn" id="resetBtn">🔄 Reset Saldo</button>

<script>
// ===== SIMBOL (fallback CSS biar tetap keren tanpa gambar) =====
const SYMBOLS = [
  { name: 'Dirt',         emoji: '🟫', payout: 10,  weight: 30, color: '#8B4513' },
  { name: 'Grass',        emoji: '🌿', payout: 20,  weight: 25, color: '#228B22' },
  { name: 'Wood Block',   emoji: '🪵', payout: 30,  weight: 20, color: '#654321' },
  { name: 'Rock',         emoji: '🪨', payout: 50,  weight: 12, color: '#808080' },
  { name: 'Small Lock',   emoji: '🔒', payout: 100, weight: 7,  color: '#C0C0C0' },
  { name: 'World Lock',   emoji: '🔐', payout: 200, weight: 4,  color: '#FFD700' },
  { name: 'Diamond Lock', emoji: '💎', payout: 500, weight: 2,  color: '#4dd0e1' }
];

let balance = 1000;
let bet = 10;
let spinning = false;
let totalSpin = 0;
let totalWin = 0;
let totalJackpot = 0;

// ===== AUDIO =====
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function playTone(freq, duration, type = 'sine', volume = 0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function sfxSpin() { playTone(400 + Math.random()*200, 0.04, 'square', 0.06); }
function sfxReelStop() { playTone(180, 0.12, 'square', 0.12); }
function sfxWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.15,'sine',0.2),i*80)); }
function sfxJackpot() { [523,659,784,1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>playTone(f,0.4,'sine',0.25),i*70)); }
function sfxLose() { playTone(150, 0.25, 'sawtooth', 0.08); }

// ===== DOM =====
const $ = id => document.getElementById(id);
const balanceEl = $('balance');
const betEl = $('betAmount');
const spinBtn = $('spinBtn');
const betUp = $('betUp');
const betDown = $('betDown');
const messageEl = $('message');
const resetBtn = $('resetBtn');
const machine = $('machine');
const particlesEl = $('particles');
const totalSpinEl = $('totalSpin');
const totalWinEl = $('totalWin');
const totalJackpotEl = $('totalJackpot');
const reelWindows = [$('reel1'), $('reel2'), $('reel3')];
const reelStrips = [$('strip1'), $('strip2'), $('strip3')];

// ===== RANDOM =====
function getRandomSymbol() {
  const totalWeight = SYMBOLS.reduce((sum, s) => sum + s.weight, 0);
  let random = Math.random() * totalWeight;
  for (const s of SYMBOLS) {
    random -= s.weight;
    if (random <= 0) return s;
  }
  return SYMBOLS[0];
}

// ===== RENDER ICON (pakai emoji — anti ribet) =====
function renderIcon(sym) {
  return `
    <div class="fallback-icon" style="background:${sym.color}; display:flex; flex-direction:column; gap:2px;">
      <div style="font-size:clamp(20px,6vw,32px);">${sym.emoji}</div>
      <div style="font-size:clamp(7px,2vw,9px); line-height:1;">${sym.name}</div>
    </div>
  `;
}

// ===== STRIP =====
function getItemHeight() {
  return reelWindows[0].offsetHeight || 110;
}

function fillStrip(strip, count = 20) {
  strip.innerHTML = '';
  const h = getItemHeight();
  for (let i = 0; i < count; i++) {
    const item = document.createElement('div');
    item.className = 'reel-item';
    item.style.height = h + 'px';
    item.innerHTML = renderIcon(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
    strip.appendChild(item);
  }
}

function setStripToSymbol(strip, symbol) {
  strip.innerHTML = '';
  const h = getItemHeight();
  const item = document.createElement('div');
  item.className = 'reel-item';
  item.style.height = h + 'px';
  item.innerHTML = renderIcon(symbol);
  strip.appendChild(item);
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(0)';
}

reelStrips.forEach(strip => setStripToSymbol(strip, getRandomSymbol()));

// ===== ANIMASI =====
function animateReel(strip, duration, finalSymbol) {
  return new Promise(resolve => {
    const h = getItemHeight();
    fillStrip(strip, 20);
    const finalItem = document.createElement('div');
    finalItem.className = 'reel-item';
    finalItem.style.height = h + 'px';
    finalItem.innerHTML = renderIcon(finalSymbol);
    strip.appendChild(finalItem);
    
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;
    
    const totalDistance = 20 * h;
    strip.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.85, 0.4, 1)`;
    strip.style.transform = `translateY(-${totalDistance}px)`;
    
    const soundInterval = setInterval(sfxSpin, 60);
    setTimeout(() => {
      clearInterval(soundInterval);
      sfxReelStop();
      resolve();
    }, duration);
  });
}

// ===== SPIN =====
async function spin() {
  if (spinning || balance < bet) return;
  initAudio();
  
  spinning = true;
  balance -= bet;
  updateUI();
  
  messageEl.textContent = '🎰 Spinning...';
  messageEl.className = 'message';
  reelWindows.forEach(r => r.classList.remove('win'));
  
  const isJackpotSpin = Math.random() < 0.05;
  let results;
  if (isJackpotSpin) {
    const high = SYMBOLS.filter(s => s.payout >= 50);
    const chosen = high[Math.floor(Math.random() * high.length)];
    results = [chosen, chosen, chosen];
  } else {
    results = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
  }
  
  await Promise.all([
    animateReel(reelStrips[0], 1200, results[0]),
    animateReel(reelStrips[1], 1600, results[1]),
    animateReel(reelStrips[2], 2000, results[2])
  ]);
  
  setStripToSymbol(reelStrips[0], results[0]);
  setStripToSymbol(reelStrips[1], results[1]);
  setStripToSymbol(reelStrips[2], results[2]);
  
  await new Promise(r => setTimeout(r, 200));
  checkWin(results);
  spinning = false;
  updateUI();
}

// ===== CHECK WIN =====
function checkWin(results) {
  totalSpin++;
  const [a, b, c] = results;
  let winAmount = 0, message = '', isJackpot = false;
  
  if (a.name === b.name && b.name === c.name) {
    winAmount = bet * a.payout;
    message = `🎉 JACKPOT! ${a.name} = ${winAmount} koin!`;
    isJackpot = true;
    totalJackpot++;
    reelWindows.forEach(r => r.classList.add('win'));
    sfxJackpot();
    triggerJackpotEffect();
  }
  else if (a.name === b.name || b.name === c.name || a.name === c.name) {
    winAmount = bet * 2;
    message = `✨ Menang! Dua sama = ${winAmount} koin`;
    if (a.name === b.name) { reelWindows[0].classList.add('win'); reelWindows[1].classList.add('win'); }
    if (b.name === c.name) { reelWindows[1].classList.add('win'); reelWindows[2].classList.add('win'); }
    if (a.name === c.name) { reelWindows[0].classList.add('win'); reelWindows[2].classList.add('win'); }
    sfxWin();
  }
  else {
    message = '😢 Coba lagi!';
    sfxLose();
  }
  
  if (winAmount > 0) {
    balance += winAmount;
    totalWin++;
    messageEl.className = 'message ' + (isJackpot ? 'jackpot' : 'win');
  } else {
    messageEl.className = 'message lose';
  }
  
  messageEl.textContent = message;
  
  if (balance < 5) {
    setTimeout(() => {
      if (balance < 5) {
        messageEl.textContent = '💸 Bangkrut! Klik RESET';
        messageEl.className = 'message lose';
      }
    }, 2000);
  }
  
  updateUI();
}

// ===== JACKPOT EFFECT =====
function triggerJackpotEffect() {
  machine.classList.add('shake');
  setTimeout(() => machine.classList.remove('shake'), 500);
  
  const overlay = document.createElement('div');
  overlay.className = 'jackpot-overlay';
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 1500);
  
  const emojis = ['💎', '🔐', '⭐', '🎉', '✨', '🏆', '👑', '💰'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + '%';
      p.style.fontSize = (18 + Math.random() * 25) + 'px';
      p.style.animationDuration = (2 + Math.random() * 2) + 's';
      particlesEl.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }, i * 30);
  }
}

// ===== UPDATE UI =====
function updateUI() {
  balanceEl.textContent = balance;
  betEl.textContent = bet;
  totalSpinEl.textContent = totalSpin;
  totalWinEl.textContent = totalWin;
  totalJackpotEl.textContent = totalJackpot;
  spinBtn.disabled = spinning || balance < bet;
  betUp.disabled = bet >= 100 || spinning;
  betDown.disabled = bet <= 5 || spinning;
}

// ===== EVENT =====
spinBtn.addEventListener('click', spin);
betUp.addEventListener('click', () => { if (bet < 100) bet = Math.min(bet * 2, 100); updateUI(); });
betDown.addEventListener('click', () => { if (bet > 5) bet = Math.max(bet / 2, 5); updateUI(); });
resetBtn.addEventListener('click', () => {
  balance = 1000; bet = 10; totalSpin = 0; totalWin = 0; totalJackpot = 0;
  messageEl.textContent = 'Saldo direset! Selamat bermain 🎰';
  messageEl.className = 'message';
  reelWindows.forEach(r => r.classList.remove('win'));
  reelStrips.forEach(strip => setStripToSymbol(strip, getRandomSymbol()));
  updateUI();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); spin(); }
});

// Re-setup kalau ukuran layar berubah (rotate HP)
window.addEventListener('resize', () => {
  reelStrips.forEach(strip => {
    const sym = getRandomSymbol();
    setStripToSymbol(strip, sym);
  });
});

updateUI();
</script>
</body>
</html>
